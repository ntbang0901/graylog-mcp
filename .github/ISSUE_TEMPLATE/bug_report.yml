name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste log lines, tokens or URLs of private Graylog instances. For security problems (for example a value that should be masked but is not), see SECURITY.md instead."
  - type: input
    id: version
    attributes:
      label: graylog-mcp version
      placeholder: "graylog-mcp --version"
    validations:
      required: true
  - type: input
    id: graylog
    attributes:
      label: Graylog version and search backend
      placeholder: "6.1.16 with OpenSearch 2.15 (shown by list_instances)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
      description: The tool called, its arguments and the (redacted) result or error.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Remove secrets and hostnames.
      render: toml
