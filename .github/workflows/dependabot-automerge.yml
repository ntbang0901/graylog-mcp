name: Dependabot auto-merge

# Patch and minor updates merge on their own once the main ruleset's required check ("CI passed") is green.
# Major updates wait for a maintainer.

on: pull_request

permissions: {}

jobs:
  automerge:
    name: Enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'ntbang0901/graylog-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
