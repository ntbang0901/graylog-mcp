# graylog-mcp configuration example.
# Point the server at it with --config path/to/config.toml or GRAYLOG_MCP_CONFIG.
# Secrets are never written here: name the environment variable that holds them.

default_instance = "prod"
timezone = "Asia/Ho_Chi_Minh"        # naive times in tool calls and all output use this zone
ui_links = "auto"                    # "off": no link to the admin page's log explorer in results

[limits]
default_limit = 50                   # messages per search when the model does not say
max_limit = 500
max_value_chars = 2000               # per field value
max_message_chars = 20000            # get_message
max_output_chars = 24000             # per tool call (~6-8k tokens)
search_output_chars = 12000          # search_logs; page with next_offset
message_output_chars = 4000          # get_message without 'fields'
context_output_chars = 8000          # context_around
max_groups = 100
sample_concurrency = 4
scan_concurrency = 8               # Graylog requests in flight during one scan
max_requests = 20                  # Graylog requests of one trace_request or ask call; near it, optional work is dropped and named

[redaction]
packs = ["vn"]                       # vn (phone, CCCD), us (SSN), eu (IBAN), uk (NINO), in (Aadhaar, PAN)
vn_cmnd = false                      # also mask bare 9-digit numbers (old CMND); noisy
sensitive_fields = ["national_id"]   # extra field names whose whole value is masked
exclude_fields = ["token_count"]     # field names never masked by name
allow = ['^noreply@example\.com$']   # values that must never be masked (full match)

[[redaction.patterns]]
name = "order_token"
pattern = "OTK-[A-Z0-9]{16}"
replacement = "[ORDER_TOKEN]"

[stacktrace]
app_packages = ["com.example", "/srv/myapp/"]   # frames containing these are kept
max_frames = 8                       # frames kept per trace when app_packages is empty
max_app_frames = 25

# Defaults for every instance; each [instances.x] may override any of these keys.
[investigation]
trace_fields = ["trace_id", "traceId", "correlation_id", "request_id", "X-Request-ID"]
service_fields = ["service", "application_name", "source"]
# Level is a syslog number when shipped via GELF, a string with some shippers:
error_query = "level:<=3"            # e.g. "level:<=3 OR level:(ERROR OR FATAL)"
default_fields = ["timestamp", "source", "level", "message"]
message_lookup_range = "30d"         # get_message with a bare id searches this far back
group_fields = { exception = "exception_class", logger = "logger_name", source = "source" }
# root_cause / detect_changes: the first existing field of each list is used
version_fields = ["app_version", "version", "build", "git_commit", "image_tag"]
latency_fields = ["took_ms", "duration_ms", "elapsed_ms", "response_time_ms"]
# log explorer's API table: the first existing field of each list is used
endpoint_fields = ["route", "http_route", "path", "request_path", "uri", "url_path", "endpoint"]
status_fields = ["http_status", "status_code", "response_status", "status"]
business_error_query = ""            # empty: http status 400-499
technical_error_query = ""           # empty: http status 500-599, or error_query
slow_ms = [1000, 3000, 10000]        # thresholds offered for "slow calls"
latency_unit = "auto"                # ms or s; auto reads request_time as seconds, the rest as ms
# lines that mark a process start/stop or a config reload
change_query = '(message:Started AND message:"running for") OR "Shutting down" OR "Graceful shutdown" OR SIGTERM'

# Several systems (ERP, CXP, PAYMENT...) each with their own environments? Use [groups.<g>.environments.<e>]
# and [environments.<e>] instead of [instances]: see "Groups and your own environments" in the README.
#
# One instance per environment. In an application repository, commit this file as .graylog-mcp.toml
# at the root: the server finds it automatically. An instance whose token variable is not set is
# disabled (shown by list_instances) instead of stopping the server.
[instances.prod]
url = "https://graylog.example.com"
description = "Production"
token_env = "GRAYLOG_PROD_TOKEN"     # access token of a read-only user (Reader role + stream permissions)
ca_bundle = "/etc/ssl/certs/internal-ca.pem"
timeout = 30
max_concurrency = 16                 # requests in flight to this Graylog, across every call and session
retries = 2                          # after connection errors, 429 and 502/503/504
# aliases = ["môi trường thật"]      # other words for it in a question to ask ("production" is known for "prod")
# provider_data = "none"             # what ask may hand to a provider about this instance: "none",
#                                    # "question_only" or "question_and_logs" (default); README: Providers

[instances.staging]
url = "https://graylog-staging.example.com"
description = "Staging, deployed on every merge to main"
auth = "basic"
username = "readonly"
password_env = "GRAYLOG_STAGING_PASSWORD"
verify_tls = false
proxy = "http://proxy.example.com:3128"
error_query = "level:ERROR OR level:FATAL"
# message_api = "auto"               # auto | universal | views | scripting
# aggregation_api = "auto"           # auto | views | scripting

[presets.payment_errors]
description = "Errors from the payment services, grouped by exception"
tool = "error_summary"
args = { query = "service:payment", range = "1h" }

[presets.slow_requests]
description = "Requests slower than 2s"
tool = "search_logs"
args = { query = "took_ms:>2000", range = "30m", fields = ["timestamp", "source", "path", "took_ms"] }

[presets.health]
description = "Quick health scan: high and critical rules"
tool = "scan"
args = { range = "1h", min_severity = "high" }

# The team's own words (README: Glossary). ask and trace_request read them; describe(what="glossary") lists them
# for the model of a chat client.
[glossary.terms.payment]
description = "payment service"      # how the answer names what the word was read as
aliases = ["thanh toán", "payment"]  # matched as whole words, with or without accents; the longest phrase wins
query = "service:payment"            # ANDed into the search when a question names the term

[glossary.terms.refund]
aliases = ["hoàn tiền", "refund"]
keywords = ["refund"]                # the English words the logs use for it (listed for the model; no filter)
preset = "payment_errors"            # optional: one of the [presets] above about this term
# instances = ["prod"]               # only on these instances, groups or environments

[glossary.codes.order]
pattern = 'ORD-\d+'                  # what the code looks like
fields = ["order_id"]                # searched before the text: a number alone also matches unrelated lines

# Words that say which errors a question means. A key given here replaces the built-in list of that key.
# [glossary.error_words]
# business = ["bị từ chối", "declined", "hết hạn mức"]

# How ask reads time phrases (README: Ask in plain language).
# [ask.time]
# morning = [6, 12]                  # also noon, afternoon, evening, night
# week_start = "monday"              # or "sunday"
# date_order = "DMY"                 # "MDY": 11/12 is 12 November

# Words that say what a question asks for. A key given here replaces the built-in list of that key:
# count, compare, root_cause, error_summary, follow_flow, search, trace_code.
# [ask.intent_words]
# count = ["bao nhiêu", "how many", "số lượng"]

# ask needs no model. A provider is asked only for what the rules could not read (README: Providers). These keys
# belong in your own or a central config: a repository's own file may not set them.
# [ask]
# provider_order = ["local", "jev"]  # who is asked first; [] turns every provider off, also with a key saved
#
# [ask.providers.local]              # any OpenAI-compatible endpoint
# kind = "openai"
# base_url = "http://127.0.0.1:4000/v1"   # https, or http on this machine
# model = "acme-default"
# api_key_env = "ACME_GATEWAY_KEY"   # the NAME of the variable; leave out for an endpoint without a key
#
# [ask.providers.jev]                # TypeSafe System One; the key comes from graylog-mcp login --ask
# kind = "jev"
# can = ["score"]                    # "understand" and/or "score"; both when left out
#
# [ask.providers.cli]                # a program on this machine: JSON on stdin, JSON on stdout
# kind = "command"
# command = ["acme-llm", "--json"]
# can = ["understand"]

# Scan rules (README: Scan rules). Built-in rules: crash, resource_exhaustion, error_spike, new_error_types,
# http_5xx, connectivity, database, auth_failures.
[scan]
disable = ["auth_failures"]
exclude = 'logger_name:HealthCheck OR "GET /health"'

[scan.rules.connectivity]            # override one key of a built-in rule
min_count = 30

[scan.rules.card_declined]
description = "Bank declines"
query = 'service:payment AND message:"declined"'
severity = "high"                    # critical | high | medium | low
growth = 2.0                         # fires when the share doubled against the baseline...
min_count = 20                       # ...with at least this many matches, and the rise is significant
per_traffic = true                   # declines / payment traffic, not declines per hour
traffic_query = "service:payment"
baseline_shift = "7d"                # against the same hour of the last baseline_periods (3) weeks
# confidence = 0.99                  # how unlikely the rise must be by chance
group_by = "bank_code"
tags = ["payment"]

[scan.rules.ledger_mismatch]
query = '"ledger mismatch"'          # no condition: any match fires
severity = "critical"
instances = ["prod"]                 # only on these instances, groups or environments

# Only used with --transport streamable-http
[http]
host = "127.0.0.1"
port = 8000
path = "/mcp"
auth_token_env = "GRAYLOG_MCP_HTTP_TOKEN"
# allowed_hosts = ["mcp.example.com"]  # enables Host header (DNS rebinding) checks

# A shared server on a VM serving the team: settings of repositories it knows by identity (git remote or name),
# since it cannot read their .graylog-mcp.toml. See "A server for the team on a VM" in the README.
# [repos."acme/payment-api"]
# focus = { service = "payment" }
# default_instance = "prod"
