# graylog-mcp configuration example.
# Point the server at it with --config path/to/config.toml or GRAYLOG_MCP_CONFIG.
# Secrets are never written here: name the environment variable that holds them.

default_instance = "prod"
timezone = "Asia/Ho_Chi_Minh"        # naive times in tool calls and all output use this zone

[limits]
default_limit = 50                   # messages per search when the model does not say
max_limit = 500
max_value_chars = 2000               # per field value
max_message_chars = 20000            # get_message
max_output_chars = 24000             # per tool call (~6-8k tokens)
max_groups = 100
sample_concurrency = 4
scan_concurrency = 8               # Graylog requests in flight during one scan

[redaction]
packs = ["vn"]                       # vn (phone, CCCD), us (SSN), eu (IBAN), uk (NINO), in (Aadhaar, PAN)
vn_cmnd = false                      # also mask bare 9-digit numbers (old CMND); noisy
sensitive_fields = ["national_id"]   # extra field names whose whole value is masked
exclude_fields = ["token_count"]     # field names never masked by name
allow = ['^noreply@example\.com$']   # values that must never be masked (full match)

[[redaction.patterns]]
name = "order_token"
pattern = "OTK-[A-Z0-9]{16}"
replacement = "[ORDER_TOKEN]"

[stacktrace]
app_packages = ["com.example", "/srv/myapp/"]   # frames containing these are kept
max_frames = 8                       # frames kept per trace when app_packages is empty
max_app_frames = 25

# Defaults for every instance; each [instances.x] may override any of these keys.
[investigation]
trace_fields = ["trace_id", "traceId", "correlation_id", "request_id", "X-Request-ID"]
service_fields = ["service", "application_name", "source"]
# Level is a syslog number when shipped via GELF, a string with some shippers:
error_query = "level:<=3"            # e.g. "level:<=3 OR level:(ERROR OR FATAL)"
default_fields = ["timestamp", "source", "level", "message"]
message_lookup_range = "30d"         # get_message with a bare id searches this far back
group_fields = { exception = "exception_class", logger = "logger_name", source = "source" }
# root_cause / detect_changes: the first existing field of each list is used
version_fields = ["app_version", "version", "build", "git_commit", "image_tag"]
latency_fields = ["took_ms", "duration_ms", "elapsed_ms", "response_time_ms"]
# lines that mark a process start/stop or a config reload
change_query = '(message:Started AND message:"running for") OR "Shutting down" OR "Graceful shutdown" OR SIGTERM'

# Several systems (ERP, CXP, PAYMENT...) each with their own environments? Use [groups.<g>.environments.<e>]
# and [environments.<e>] instead of [instances]: see "Groups and your own environments" in the README.
#
# One instance per environment. In an application repository, commit this file as .graylog-mcp.toml
# at the root: the server finds it automatically. An instance whose token variable is not set is
# disabled (shown by list_instances) instead of stopping the server.
[instances.prod]
url = "https://graylog.example.com"
description = "Production"
token_env = "GRAYLOG_PROD_TOKEN"     # access token of a read-only user (Reader role + stream permissions)
ca_bundle = "/etc/ssl/certs/internal-ca.pem"
timeout = 30

[instances.staging]
url = "https://graylog-staging.example.com"
description = "Staging, deployed on every merge to main"
auth = "basic"
username = "readonly"
password_env = "GRAYLOG_STAGING_PASSWORD"
verify_tls = false
proxy = "http://proxy.example.com:3128"
error_query = "level:ERROR OR level:FATAL"
# message_api = "auto"               # auto | universal | views | scripting
# aggregation_api = "auto"           # auto | views | scripting

[presets.payment_errors]
description = "Errors from the payment services, grouped by exception"
tool = "error_summary"
args = { query = "service:payment", range = "1h" }

[presets.slow_requests]
description = "Requests slower than 2s"
tool = "search_logs"
args = { query = "took_ms:>2000", range = "30m", fields = ["timestamp", "source", "path", "took_ms"] }

[presets.health]
description = "Quick health scan: high and critical rules"
tool = "scan"
args = { range = "1h", min_severity = "high" }

# Scan rules (README: Scan rules). Built-in rules: crash, resource_exhaustion, error_spike, new_error_types,
# http_5xx, connectivity, database, auth_failures.
[scan]
disable = ["auth_failures"]
exclude = 'logger_name:HealthCheck OR "GET /health"'

[scan.rules.connectivity]            # override one key of a built-in rule
min_count = 30

[scan.rules.card_declined]
description = "Bank declines"
query = 'service:payment AND message:"declined"'
severity = "high"                    # critical | high | medium | low
growth = 2.0                         # fires when the rate doubled against the baseline...
min_count = 20                       # ...with at least this many matches
group_by = "bank_code"
tags = ["payment"]

[scan.rules.ledger_mismatch]
query = '"ledger mismatch"'          # no condition: any match fires
severity = "critical"
instances = ["prod"]                 # only on these instances, groups or environments

# Only used with --transport streamable-http
[http]
host = "127.0.0.1"
port = 8000
path = "/mcp"
auth_token_env = "GRAYLOG_MCP_HTTP_TOKEN"
# allowed_hosts = ["mcp.example.com"]  # enables Host header (DNS rebinding) checks
