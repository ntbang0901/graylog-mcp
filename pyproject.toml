[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "graylog-mcp"
version = "0.1.0"
description = "Read-only MCP server for Graylog 4.x-7.x: version-aware search, exact aggregations, request tracing and redaction of sensitive data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "graylog-mcp contributors" }]
keywords = ["graylog", "mcp", "model-context-protocol", "logs", "observability", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
    # zoneinfo has no system tz database on Windows
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/ntbang0901/graylog-mcp"
Issues = "https://github.com/ntbang0901/graylog-mcp/issues"
Changelog = "https://github.com/ntbang0901/graylog-mcp/blob/main/CHANGELOG.md"

[project.scripts]
graylog-mcp = "graylog_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graylog_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs running Graylog instances (see tests/integration)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["graylog_mcp", "tests"]
