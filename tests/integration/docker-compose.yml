# Graylog version matrix for integration tests. One profile per version:
#   docker compose --profile v50 up -d
#   GRAYLOG_IT_URL=http://127.0.0.1:9050 python tests/integration/seed.py
#   GRAYLOG_IT_URL=http://127.0.0.1:9050 pytest -m integration
# Login for all instances: admin / admin (test only).

x-graylog-env: &graylog-env
  GRAYLOG_PASSWORD_SECRET: "integration-tests-only-0123456789abcdef"
  GRAYLOG_ROOT_PASSWORD_SHA2: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"
  GRAYLOG_HTTP_BIND_ADDRESS: "0.0.0.0:9000"
  GRAYLOG_HTTP_EXTERNAL_URI: "http://127.0.0.1:9000/"
  GRAYLOG_SKIP_PREFLIGHT_CHECKS: "true"
  GRAYLOG_ROOT_TIMEZONE: "UTC"
  GRAYLOG_SERVER_JAVA_OPTS: "-Xms768m -Xmx768m"

x-opensearch-env: &opensearch-env
  discovery.type: single-node
  DISABLE_INSTALL_DEMO_CONFIG: "true"
  DISABLE_SECURITY_PLUGIN: "true"
  action.auto_create_index: "false"
  OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"

services:
  # ---------------------------------------------------------------- 4.3
  mongo-43:
    image: mongo:5.0
    profiles: [v43]
  opensearch-43:
    image: opensearchproject/opensearch:1.3.19
    environment: *opensearch-env
    profiles: [v43]
  graylog-43:
    image: graylog/graylog:4.3
    environment:
      <<: *graylog-env
      GRAYLOG_MONGODB_URI: mongodb://mongo-43:27017/graylog
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch-43:9200
    depends_on: [mongo-43, opensearch-43]
    ports: ["9043:9000", "12243:12201"]
    profiles: [v43]

  # ---------------------------------------------------------------- 5.0
  mongo-50:
    image: mongo:6.0
    profiles: [v50]
  opensearch-50:
    image: opensearchproject/opensearch:2.15.0
    environment: *opensearch-env
    profiles: [v50]
  graylog-50:
    image: graylog/graylog:5.0
    environment:
      <<: *graylog-env
      GRAYLOG_MONGODB_URI: mongodb://mongo-50:27017/graylog
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch-50:9200
    depends_on: [mongo-50, opensearch-50]
    ports: ["9050:9000", "12250:12201"]
    profiles: [v50]

  # ---------------------------------------------------------------- 5.2
  mongo-52:
    image: mongo:6.0
    profiles: [v52]
  opensearch-52:
    image: opensearchproject/opensearch:2.15.0
